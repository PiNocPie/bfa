<title>BFA</title>
<meta name="description" content="The convenience store for AI agents. Open 24 hours, for every agent.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Editorial ledger: bone paper, black ink, one slab of NEAR green. Type does the work; boxes are rare.
   Grotesk for words, Plex Mono only for money, ids and code. */
:root{
  --paper:#f4f3ee; --sheet:#fbfaf7; --ink:#0c0e0d; --ink2:#2a2d2b; --muted:#62655f; --faint:#9a9c95; --rule:#d6d5cc; --rule-strong:#0c0e0d;
  --green:#7fd6ae; --green-ink:#2c7a59; --on-green:#10261c; --wash:#e7e6dd;
  --sign:#d6ecdf; --sign-ink:#173326; --tag:#f3e2a6; --tag-ink:#2b2611; --neon:#e8735f;
  --bad:#b83226; --warn:#8a5a00;
  --band:#0c0e0d; --band-ink:#f2f1ea; --band-muted:#9a9c95;
  --f-sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e100f; --sheet:#151816; --ink:#eceae2; --ink2:#cfcdc5; --muted:#9a9c95; --faint:#62655f; --rule:#262a27; --rule-strong:#eceae2;
  --green:#5bbf93; --green-ink:#86d9b3; --on-green:#0c1f16; --wash:#1b1f1c;
  --sign:#1a2a22; --sign-ink:#d3eadd; --tag:#cdb874; --tag-ink:#1f1a08; --neon:#e08a78;
  --bad:#ff8a7a; --warn:#e6b35c;
  --band:#151816; --band-ink:#eceae2; --band-muted:#9a9c95; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e100f; --sheet:#151816; --ink:#eceae2; --ink2:#cfcdc5; --muted:#9a9c95; --faint:#62655f; --rule:#262a27; --rule-strong:#eceae2;
  --green:#5bbf93; --green-ink:#86d9b3; --on-green:#0c1f16; --wash:#1b1f1c;
  --sign:#1a2a22; --sign-ink:#d3eadd; --tag:#cdb874; --tag-ink:#1f1a08; --neon:#e08a78;
  --bad:#ff8a7a; --warn:#e6b35c;
  --band:#151816; --band-ink:#eceae2; --band-muted:#9a9c95; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
main{flex:1}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-sans)}
h1{font-weight:800;font-size:clamp(2.5rem,6.2vw,4.9rem);line-height:.96;letter-spacing:-.045em}
h2{font-weight:700;font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.05;letter-spacing:-.03em}
h3{font-weight:700;font-size:1.08rem;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
.label{font:500 .78rem/1.3 var(--f-sans);color:var(--muted)}
.muted{color:var(--muted)}
.sub{font-size:.86rem;color:var(--muted)}
.tid{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.r{text-align:right}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{padding-block:44px 80px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:28px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:900 1.4rem/1 var(--f-sans);letter-spacing:-.06em}
.brand i{display:none}
.navlinks{display:flex;gap:22px;flex-wrap:wrap;font-size:.94rem;font-weight:500}
.navlinks a{text-decoration:none;color:var(--muted)}
.navlinks a:hover{color:var(--ink)}
.navlinks a[aria-current="page"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:3px;text-underline-offset:8px}
.top .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.net{display:inline-flex;align-items:center;gap:7px;font:500 .76rem/1 var(--f-mono);color:var(--muted);text-transform:lowercase}
.net::before{content:"";width:8px;height:8px;background:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .94rem/1 var(--f-sans);padding:0 18px;height:44px;border-radius:3px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,color .12s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.accent{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.accent:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.small{height:34px;padding:0 12px;font-size:.84rem}
.btn.ghost{border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:progress}
.btn.link{border:0;height:auto;padding:0;background:none;text-decoration:underline;text-underline-offset:4px;font-weight:600}
.btn.link:hover{background:none;color:var(--ink);text-decoration-color:var(--green)}

.preview-note{font-size:.9rem;border-left:3px solid var(--bad);padding:8px 12px;background:var(--wash);margin-bottom:22px}

/* status: a square and a word, no capsules */
.pill{display:inline-flex;align-items:center;gap:7px;font:500 .84rem/1 var(--f-sans);white-space:nowrap;color:var(--ink)}
.pill::before{content:"";width:8px;height:8px;background:var(--faint);flex:none}
.pill.ok::before{background:var(--green)}
.pill.info::before{background:transparent;border:1.5px solid var(--muted)}
.pill.bad{color:var(--bad)} .pill.bad::before{background:var(--bad)}
.pill.plain{color:var(--muted)}

/* tables: rules only */
.tbox{overflow-x:auto;border-top:2px solid var(--rule-strong)}
table{border-collapse:collapse;width:100%}
th{font:500 .78rem/1 var(--f-sans);color:var(--muted);text-align:left;padding:14px 14px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:15px 14px 15px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th.r,td.r{padding-left:14px;padding-right:14px}
th.r:last-child,td.r:last-child{padding-right:0}
td.mono{font-size:.86rem}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:56px;align-items:stretch;padding-bottom:56px}
.hero-copy{display:flex;flex-direction:column;justify-content:center;padding-block:28px}
.hero h1 em{font-style:normal;color:var(--green-ink)}
.hero .lede{font-size:1.14rem;line-height:1.55;color:var(--ink2);max-width:46ch;margin-top:26px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px;align-items:center}
.slab{background:var(--sign);border-radius:4px;padding:40px 36px 196px;display:flex;align-items:flex-start;align-self:center;justify-content:center;position:relative;overflow:hidden}
.slab{justify-content:flex-end}
.slab .big-guy{position:absolute;left:24px;bottom:10px;z-index:3;width:168px;height:auto;filter:drop-shadow(0 10px 14px rgba(4,19,12,.25))}
.slab .rcpt{max-width:340px;margin-right:6px}
.rcpt{position:relative;width:100%;max-width:380px;filter:drop-shadow(0 18px 22px rgba(4,19,12,.28))}
.receipt{background:#fbfaf5;color:#0c0e0d;padding:22px 22px 34px;font:400 .78rem/1.75 var(--f-mono);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/18px 9px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/18px 9px repeat-x}
.receipt .rh{text-align:center;padding-bottom:12px;border-bottom:1px dashed #0c0e0d;margin-bottom:10px}
.receipt .rh b{display:block;font:900 1.5rem/1 var(--f-sans);letter-spacing:-.06em}
.receipt .rh span{color:#62655f}
.receipt dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px}
.receipt dt{color:#62655f}
.receipt dd{margin:0;text-align:right;overflow-wrap:anywhere}
.receipt .tot{border-top:1px dashed #0c0e0d;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:600;font-size:.9rem}
.receipt .ft{margin-top:12px;text-align:center;color:#62655f;font-size:.72rem}

.points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;padding-block:44px;border-top:2px solid var(--rule-strong)}
.points h3{font-size:1.25rem;letter-spacing:-.025em}
.points p{color:var(--muted);margin-top:10px;max-width:36ch}

.menu{padding-block:44px;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:56px}
.menu .mh p{color:var(--muted);margin-top:12px;max-width:34ch}
.menu .mh .btn{margin-top:20px}
.leaders{list-style:none;margin:0;padding:0}
.leaders li{display:flex;align-items:baseline;gap:10px;padding-block:13px;border-bottom:1px solid var(--rule)}
.leaders li:first-child{padding-top:0}
.leaders .nm{font-weight:600;min-width:0}
.leaders .nm small{display:block;font:400 .76rem/1.4 var(--f-mono);color:var(--muted);margin-top:2px}
.leaders i{flex:1;border-bottom:1.5px dotted var(--faint);transform:translateY(-5px);min-width:24px}
.leaders b{font:500 .95rem/1 var(--f-mono)}
.leaders .st{font-size:.8rem;color:var(--muted);width:6.5rem;text-align:right;flex:none}

.band{background:var(--band);color:var(--band-ink);border-radius:4px;padding:40px 44px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:center;margin-top:12px}
.band p{color:var(--band-muted);margin-top:10px}
.band pre{background:transparent;border:1px solid #3a3e3b;color:var(--band-ink)}
.band .btn{border-color:var(--band-ink);color:var(--band-ink);margin-top:12px}
.band .btn:hover{background:var(--band-ink);color:var(--band)}

/* ---------- inner pages ---------- */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.page-head h1{font-size:clamp(2rem,4.4vw,3.2rem)}
.page-head p{color:var(--muted);max-width:60ch;margin-top:14px;font-size:1.04rem}
pre{margin:0;background:var(--wash);border-radius:3px;padding:14px 16px;overflow-x:auto;line-height:1.6;color:var(--ink);font-size:.82rem}
.stack{display:grid;gap:12px;align-content:start}
.stack > h3{margin-top:10px}
.stack > h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 40px}

/* ---------- console ---------- */
.console{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:56px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:grid;gap:0;border-top:2px solid var(--rule-strong)}
.rail a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:11px 0;color:var(--muted);font-weight:500;border-bottom:1px solid var(--rule)}
.rail a:hover{color:var(--ink)}
.rail a[aria-current="page"]{color:var(--ink);font-weight:700}
.rail a[aria-current="page"]::after{content:"";width:8px;height:8px;background:var(--green)}
.rail a .sub{font-family:var(--f-mono);font-size:.76rem}
.rail a[aria-current="page"] .sub{display:none}
.rail #signout{border-bottom:0;font-size:.88rem;margin-top:10px}
.rail .who{padding:14px 0 12px;border-bottom:1px solid var(--rule)}
.rail .who b{display:block;font-weight:700;font-size:.92rem;overflow-wrap:anywhere;line-height:1.3}
.rail .who span{font:400 .74rem/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.console > div > h1{font-size:clamp(2rem,4vw,2.9rem);margin-bottom:26px}

/* the statement: one big number, then the facts in a ruled list */
.statement{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;padding-bottom:30px;border-bottom:2px solid var(--rule-strong);margin-bottom:34px;align-items:end}
.statement .big{font:500 clamp(2.6rem,6vw,4.2rem)/1 var(--f-mono);letter-spacing:-.05em;display:block;margin-top:8px}
.statement .big small{font-size:.38em;letter-spacing:0;color:var(--muted);margin-left:8px}
.statement .sub{margin-top:10px}
.facts{margin:0;display:grid}
.facts > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding-block:10px;border-bottom:1px solid var(--rule)}
.facts > div:last-child{border-bottom:0}
.facts dt{color:var(--muted);font-size:.9rem}
.facts dd{margin:0;font:500 .92rem/1.4 var(--f-mono);text-align:right;overflow-wrap:anywhere;min-width:0}
.facts .bar{grid-column:1/-1}
.bar{height:4px;background:var(--wash);margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.hot i{background:var(--bad)}

.section{margin-top:40px}
.section > .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

/* panels are ruled sections, not cards */
.panel{border-top:2px solid var(--rule-strong);margin-bottom:40px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 0 4px;flex-wrap:wrap}
.panel .ph h3{font-size:1.3rem;letter-spacing:-.025em}
.panel .pb{padding:16px 0 0;display:grid;gap:22px}
.panel .pf{padding:22px 0 0;display:flex;justify-content:flex-start;align-items:center;gap:14px;flex-wrap:wrap}
.field{display:grid;gap:8px;min-width:0}
.field > span{font-weight:600;font-size:.92rem}
.field small{color:var(--muted);font-size:.84rem;max-width:64ch}
.input,select{font:400 .95rem var(--f-sans);height:44px;padding:0 12px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet);color:var(--ink);min-width:0;width:100%}
.input:focus,select:focus,.money:focus-within{border-color:var(--ink);outline:none}
.money{display:flex;align-items:center;height:44px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet);overflow:hidden;max-width:12rem}
.money span{padding:0 4px 0 12px;font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.money input{border:0;background:transparent;height:100%;padding:0 12px 0 2px;font:500 1rem var(--f-mono);color:var(--ink);width:100%;min-width:0;outline:none}
.scopes{display:grid;gap:10px}
.scopes label,.picklist label{display:grid;grid-template-columns:1.2rem minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem}
.scopes code{font-weight:600}
input[type=checkbox]{accent-color:var(--green-ink);width:16px;height:16px;margin:3px 0 0}
.picklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;padding:14px 0 0}
.secret{display:grid;gap:12px;background:var(--sign);color:var(--sign-ink);border-radius:4px;padding:22px;margin-bottom:34px}
.secret .sub{color:var(--sign-ink)}
.secret .val{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secret code{font-size:.86rem;background:#fbfaf5;color:#0c0e0d;padding:11px 12px;border-radius:3px;overflow-wrap:anywhere;flex:1 1 260px}
.secret pre{background:rgba(4,19,12,.08);color:var(--sign-ink)}
.secret .btn{border-color:var(--sign-ink);color:var(--sign-ink)}
.secret .btn.solid{background:var(--sign-ink);color:var(--sign)}
.addr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addr code{font-size:.84rem;background:var(--wash);padding:11px 12px;border-radius:3px;overflow-wrap:anywhere;flex:1 1 260px}

/* setup steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:6px;align-items:baseline}
.steps li::before{content:counter(s);font:800 1.15rem/1 var(--f-sans);color:var(--ink)}
.log{font:400 .82rem/1.8 var(--f-mono);margin:0;padding:0;list-style:none}
.log li.bad{color:var(--bad)}
.empty{padding:22px 0;border-top:2px solid var(--rule-strong);display:grid;gap:14px;justify-items:start}
.empty p{color:var(--muted);max-width:56ch}

/* sign in */
.signin{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0;max-width:880px;margin:12px auto 0;border-top:2px solid var(--rule-strong)}
.signin .bb{background:var(--sign);color:var(--sign-ink);padding:40px 32px;display:grid;justify-items:start;align-content:end;gap:14px;min-height:340px}
.signin .bb p{font:700 1.35rem/1.15 var(--f-sans);letter-spacing:-.02em;max-width:14ch}
.signin .form{padding:40px 0 20px 44px;display:grid;gap:18px;align-content:start}
.signin .form h2{font-size:2.2rem}
.gwrap{display:flex;justify-content:flex-start;min-height:44px}
.gbtn{width:100%}
.or{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;color:var(--muted);font-size:.82rem}
.or::before,.or::after{content:"";height:1px;background:var(--rule)}
/* Google's button is an iframe: a light color-scheme keeps the browser from painting a white box around it on dark pages. */
#gbtn{color-scheme:light;background:transparent;line-height:0}
#gbtn iframe{color-scheme:light}

.oneway{border-left:3px solid var(--neon);background:var(--wash);padding:10px 12px;font-size:.92rem}
.oneway b{color:var(--ink)}
/* testnet: free test USDC */
.gift{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--sign);color:var(--sign-ink);border-radius:4px;padding:14px 16px;margin-bottom:30px}
.gift span{color:var(--sign-ink);opacity:.85;font-size:.92rem}
.gift .btn{margin-left:auto;background:var(--sign-ink);border-color:var(--sign-ink);color:var(--sign)}
.gift.ok b{color:var(--green-ink)}
/* routing editor */
.route{display:grid;gap:14px}
.route-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.route-list li{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.route-list .n{font:800 1.05rem/1 var(--f-sans)}
.route-list li:first-child .n{color:var(--green-ink)}
.route-list .ops{display:flex;gap:6px}
.route-add{display:flex;gap:8px;flex-wrap:wrap}
.route-add select{flex:1 1 220px;width:auto}
.route-add .input{flex:1 1 200px;width:auto}
.check{display:grid;grid-template-columns:1.2rem minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem}
.keys-hd{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.keys-hd p{max-width:56ch}
/* ---------- the store ---------- */
[hidden]{display:none!important}
.top{background:var(--sign);color:var(--sign-ink);border-bottom:0}
.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;pointer-events:none;
  background:radial-gradient(circle at 12px 0,var(--sign) 11.5px,transparent 12px) 0 0/24px 12px repeat-x}
.top .brand,.top .navlinks a{color:var(--sign-ink)}
.top .navlinks a{opacity:.78}
.top .navlinks a:hover,.top .navlinks a[aria-current="page"]{opacity:1;color:var(--sign-ink)}
.top .navlinks a[aria-current="page"]{text-decoration-color:var(--green-ink)}
.top .net{color:var(--sign-ink);opacity:.75}
.top .net::before{background:var(--green-ink)}
.top .btn{border-color:var(--sign-ink);color:var(--sign-ink)}
.top .btn:hover{background:var(--sign-ink);color:var(--sign)}
.open24{display:inline-flex;align-items:center;gap:8px;background:var(--sign-ink);color:var(--sign);font:800 .74rem/1 var(--f-sans);letter-spacing:.06em;padding:7px 10px 7px 9px;border-radius:3px;white-space:nowrap}

/* shelves: each API is a product with a shelf-edge price tag */
.aisle{margin-bottom:44px}
.aisle > h2{display:flex;align-items:center;gap:10px;font-size:1.5rem;margin-bottom:16px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 18px;padding-bottom:18px;border-bottom:8px solid var(--ink);position:relative}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:6px;background:var(--rule)}
.item{display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-width:0}
.item .box{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:14px 14px 12px;min-height:118px;display:grid;align-content:start;gap:6px}
.item .box b{font-weight:700;line-height:1.25}

.tag{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--tag);color:var(--tag-ink);border-radius:2px;padding:8px 10px;position:relative}
.tag::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:6px;background:var(--tag);transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tag .p{font:600 1.3rem/1 var(--f-mono);letter-spacing:-.04em}
.tag .p small{font-size:.55em;letter-spacing:0;margin-left:3px;opacity:.7}
.tag .s{font:600 .7rem/1.2 var(--f-sans);text-align:right}
.tag.off{background:var(--wash);color:var(--muted)}
.tag.off::before{background:var(--wash)}
.item .btn{width:100%}

.store{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:40px;align-items:start}
.basket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);max-height:calc(100vh - 110px);overflow-y:auto;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:18px;display:grid;gap:14px}
.basket h3{display:flex;justify-content:space-between;align-items:baseline}

.basket ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.basket li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.basket li .q{display:flex;gap:4px;align-items:center;font:500 .82rem/1 var(--f-mono)}
.basket li .q button{width:26px;height:26px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:3px;cursor:pointer;font:600 .9rem/1 var(--f-mono)}
.basket .sum{display:flex;justify-content:space-between;font:600 1rem/1 var(--f-mono);padding-top:4px}
.basket pre{font-size:.74rem;max-height:260px;white-space:pre-wrap;overflow-wrap:anywhere}
.basket .empty-b{color:var(--muted);font-size:.9rem}

          mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/18px 9px repeat-x}
.slip .rh{text-align:center;padding-bottom:12px;border-bottom:1px dashed #0c0e0d}
