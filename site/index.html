<title>BFA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&family=Albert+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a metered ledger. Sage paper, NEAR-green meter needle, every price printed to USDC's 6 decimals.
   Public pages (home, APIs) on top; signed-in console (overview, keys, wallet, usage) with a left rail. */
:root{
  --paper:#eceee7; --sheet:#fafaf6; --ink:#161a14; --muted:#5b6256; --faint:#8a9184; --rule:#d5d9cd;
  --accent:#00774c; --accent-fill:#00ec97; --accent-soft:#d3f5e6; --on-accent:#08140e;
  --ok:#1f6f5c; --ok-soft:#dcefe8; --info:#3d5d99; --info-soft:#e0e7f5; --bad:#b3362b; --bad-soft:#f6e0dc;
  --code:#e4e7dd;
  --f-mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111410; --sheet:#191d17; --ink:#e7eae0; --muted:#9ba393; --faint:#6f776a; --rule:#2b3128;
  --accent:#00ec97; --accent-fill:#00ec97; --accent-soft:#0d3123; --on-accent:#06130d;
  --ok:#6fcf97; --ok-soft:#163222; --info:#93b2ff; --info-soft:#1c2740; --bad:#ff8c7d; --bad-soft:#3b1c18;
  --code:#20251e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111410; --sheet:#191d17; --ink:#e7eae0; --muted:#9ba393; --faint:#6f776a; --rule:#2b3128;
  --accent:#00ec97; --accent-fill:#00ec97; --accent-soft:#0d3123; --on-accent:#06130d;
  --ok:#6fcf97; --ok-soft:#163222; --info:#93b2ff; --info-soft:#1c2740; --bad:#ff8c7d; --bad-soft:#3b1c18;
  --code:#20251e; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 clamp(1.9rem,4.4vw,3.1rem)/1.08 var(--f-mono);letter-spacing:-.04em}
h2{font:700 1.35rem/1.2 var(--f-mono);letter-spacing:-.03em}
h3{font:600 1rem/1.3 var(--f-body)}
p{margin:0}
code,pre,.mono{font-family:var(--f-mono);font-size:.8em}
.num{font-variant-numeric:tabular-nums}
.label{font:500 .66rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:22px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:700 1.15rem/1 var(--f-mono);letter-spacing:-.04em}
.brand i{font-style:normal;font:500 .62rem/1 var(--f-mono);color:var(--accent);letter-spacing:.06em}
.navlinks{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem}
.navlinks a{text-decoration:none;color:var(--muted);padding-block:4px;border-bottom:2px solid transparent}
.navlinks a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent-fill)}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.net{font:500 .64rem/1 var(--f-mono);letter-spacing:.06em;padding:6px 8px;border:1px dashed var(--muted);border-radius:999px;color:var(--muted);white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:8px;font:600 .9rem/1 var(--f-body);padding:11px 15px;border-radius:var(--r);border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sheet)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.accent{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.small{padding:7px 10px;font-size:.8rem}
.btn.ghost{border-color:var(--rule)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.view{padding-block:40px 64px}
.preview-note{font:500 .7rem/1.4 var(--f-mono);color:var(--muted);border-left:3px solid var(--accent-fill);padding:6px 10px;background:var(--sheet);margin-bottom:22px}

/* meter readout: USDC has 6 decimals; padding zeros are faint */
.meter{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter .z{color:var(--faint)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font:500 .68rem/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--code);color:var(--muted)}
.pill.plain::before{background:var(--faint)}

/* tables */
.tbox{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%}
th{font:500 .64rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--paper)}
td{padding:13px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper)}
.sub{font-size:.8rem;color:var(--muted)}
.tid{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:end;padding-block:28px 40px;border-bottom:1px solid var(--rule)}
.hero .lede{font-size:1.1rem;color:var(--muted);max-width:50ch;margin-top:18px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.ticket{background:var(--sheet);border:1px solid var(--ink);border-radius:2px;position:relative;font:400 .74rem/1.55 var(--f-mono);min-width:0}
.ticket .perch{position:absolute;right:28px;top:-103px;z-index:2}
.hero{padding-top:80px}
.ticket header{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px dashed var(--ink)}
.ticket ol{list-style:none;margin:0;padding:8px 0}
.ticket li{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:10px;padding:5px 14px;align-items:baseline}
.ticket li b{font-weight:500;color:var(--accent)}
.ticket li span:nth-child(2){overflow-wrap:anywhere}
.ticket footer{border-top:1px dashed var(--ink);padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ticket::before,.ticket::after{content:"";position:absolute;top:38px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--ink)}
.ticket::before{left:-8px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-8px;clip-path:inset(0 50% 0 0)}

.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.facts div{padding:22px 18px 22px 0;min-width:0}
.facts div+div{padding-left:18px;border-left:1px solid var(--rule)}
.facts b{display:block;font:700 1.45rem/1.1 var(--f-mono);letter-spacing:-.03em}
.facts span{font-size:.84rem;color:var(--muted)}

.rows{display:grid;gap:0}
.row3{display:grid;grid-template-columns:12rem minmax(0,1fr) minmax(0,1fr);gap:28px;padding-block:32px;border-bottom:1px solid var(--rule)}
.row3 > div{min-width:0}
.row3 h2{font-size:1.05rem}
.row3 p{color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;align-items:baseline}
.steps li::before{content:counter(s,decimal-leading-zero);font:500 .72rem/1 var(--f-mono);color:var(--accent)}

/* APIs page */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{color:var(--muted);max-width:62ch;margin-top:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input,select,.search{font:400 .92rem var(--f-body);padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);min-width:0}
.search{flex:1 1 240px}
.chip{font:500 .78rem/1 var(--f-body);padding:8px 11px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
.clients{display:flex;gap:8px;flex-wrap:wrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.api-name{font-weight:600}
.detail{border:1px solid var(--ink);border-radius:var(--r);background:var(--sheet);margin-top:18px}
.detail .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px;border-bottom:1px solid var(--rule)}
.detail .db{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.detail .db > div{padding:18px;min-width:0}
.detail .db > div + div{border-left:1px solid var(--rule)}
.statline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.statline div{padding:14px 18px;min-width:0}
.statline div+div{border-left:1px solid var(--rule)}
.statline b{display:block;font:500 .95rem/1.3 var(--f-mono)}
.statline span{font-size:.76rem;color:var(--muted)}
pre{margin:0;background:var(--code);border-radius:var(--r);padding:12px 14px;overflow-x:auto;line-height:1.55;color:var(--ink)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:.88rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.84rem}
.checks li{display:grid;grid-template-columns:1.2rem 8.6rem minmax(0,1fr);gap:8px;align-items:baseline}
.checks .y{color:var(--ok);font-family:var(--f-mono)} .checks .n{color:var(--bad);font-family:var(--f-mono)}
.checks .id{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.stack{display:grid;gap:10px}
.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.toolgrid div{padding:14px 16px;border-bottom:1px solid var(--rule);min-width:0}
.toolgrid div:nth-child(odd){border-right:1px solid var(--rule)}
.toolgrid div:nth-last-child(-n+2){border-bottom:0}
.toolgrid code{color:var(--accent);font-weight:500;font-size:.82rem}
.toolgrid p{font-size:.86rem;color:var(--muted);margin-top:4px}

/* console */
.console{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:grid;gap:2px}
.rail a{display:flex;justify-content:space-between;text-decoration:none;padding:9px 10px;border-radius:var(--r);color:var(--muted);font-size:.92rem}
.rail a[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent-fill)}
.rail .who{padding:10px;margin-bottom:8px;border-bottom:1px solid var(--rule)}
.rail .who b{display:block;font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.rail .who span{font:400 .66rem/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);margin-bottom:24px}
.tiles > div{padding:16px 18px;min-width:0}
.tiles > div+div{border-left:1px solid var(--rule)}
.tiles b{display:block;font:700 1.5rem/1.15 var(--f-mono);letter-spacing:-.03em;margin-top:6px}
.tiles .sub{margin-top:4px}
.bar{height:8px;border-radius:999px;background:var(--code);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent-fill)}
.bar.ok i{background:var(--ok)}
.section{margin-top:28px}
.section > .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

/* key form */
.panel{border:1px solid var(--ink);border-radius:var(--r);background:var(--sheet);margin-bottom:22px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.panel .pb{padding:18px;display:grid;gap:18px}
.panel .pf{padding:14px 18px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:6px;min-width:0}
.field > span{font-weight:600;font-size:.88rem}
.field small{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;width:fit-content;max-width:100%}
.seg button{font:500 .82rem/1 var(--f-body);padding:9px 12px;border:0;border-right:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.money{display:flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);overflow:hidden;max-width:12rem}
.money span{padding:0 10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.money input{border:0;background:transparent;padding:10px 10px 10px 0;font:500 .9rem var(--f-mono);color:var(--ink);width:100%;min-width:0}
.limits{display:grid;gap:8px}
.limit-row{display:grid;grid-template-columns:minmax(0,1fr) 9rem 7.5rem 2.2rem;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:var(--r);height:38px;cursor:pointer;font:500 1rem var(--f-mono)}
.scopes{display:grid;gap:8px}
.scopes label{display:grid;grid-template-columns:1.2rem minmax(0,1fr);gap:8px;align-items:start;font-size:.9rem}
.scopes code{color:var(--accent)}
.secret{display:grid;gap:12px;border:1px solid var(--accent-fill);background:var(--accent-soft);border-radius:var(--r);padding:16px;margin-bottom:22px}
.secret .val{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secret code{font-size:.82rem;background:var(--sheet);padding:9px 11px;border-radius:var(--r);overflow-wrap:anywhere;flex:1 1 260px}

/* wallet */
.amounts{display:flex;gap:8px;flex-wrap:wrap}
.amounts button{font:500 .9rem/1 var(--f-mono);padding:11px 14px;border-radius:var(--r);border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.amounts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.method{display:grid;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.method b{font-size:.92rem}
.method span{font-size:.8rem;color:var(--muted)}
.method[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calc{border-top:1px dashed var(--ink);border-bottom:1px dashed var(--ink);padding-block:10px;display:grid;gap:6px;font-size:.9rem}
.calc div{display:flex;justify-content:space-between;gap:12px}
.calc .tot{font-weight:600;border-top:1px solid var(--rule);padding-top:8px}
.addr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addr code{font-size:.78rem;background:var(--code);padding:9px 11px;border-radius:var(--r);overflow-wrap:anywhere;flex:1 1 260px}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.grid3 .field{align-content:start}
.switch{width:46px;height:26px;border-radius:999px;border:1px solid var(--rule);background:var(--code);position:relative;cursor:pointer;flex:none}
.switch span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent-fill);border-color:var(--accent-fill)}
.switch[aria-checked="true"] span{transform:translateX(20px);background:var(--on-accent)}
.picklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;border:1px solid var(--rule);border-radius:var(--r);padding:12px;background:var(--paper)}
.picklist label{display:grid;grid-template-columns:1.2rem minmax(0,1fr);gap:8px;align-items:start;font-size:.88rem}
.spark rect{fill:var(--accent-fill)}
/* sign in */
.signin{max-width:420px;margin:24px auto 0;border:1px solid var(--ink);background:var(--sheet);border-radius:var(--r);padding:28px;display:grid;gap:16px}
.gbtn{justify-content:center;width:100%;padding:13px}
.or{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";height:1px;background:var(--rule)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:var(--r);font-size:.88rem;z-index:30}

footer.foot{border-top:1px solid var(--rule);padding-block:22px 34px;font-size:.82rem;color:var(--muted)}
footer.foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media (max-width:900px){
  .hero,.detail .db,.grid2{grid-template-columns:minmax(0,1fr)}
  .detail .db > div + div{border-left:0;border-top:1px solid var(--rule)}
  .row3{grid-template-columns:minmax(0,1fr);gap:14px}
  .facts,.statline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3){padding-left:0;border-left:0}
  .facts div:nth-child(n+3){border-top:1px solid var(--rule)}
  .statline div:nth-child(3){border-left:0}
  .statline div:nth-child(n+3){border-top:1px solid var(--rule)}
  .console{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;gap:4px}
  .rail .who{display:none}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tiles > div+div{border-left:0;border-top:1px solid var(--rule)}
  .methods,.grid3,.picklist{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .toolgrid{grid-template-columns:minmax(0,1fr)}
  .toolgrid div:nth-child(odd){border-right:0}
  .toolgrid div:nth-last-child(2){border-bottom:1px solid var(--rule)}
  .limit-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .limit-row select:first-child{grid-column:1/-1}
  .ticket li{grid-template-columns:4.4rem minmax(0,1fr)}
  .ticket li span:last-child{grid-column:2}
  .checks li{grid-template-columns:1.2rem minmax(0,1fr)}
  .checks li > span:last-child{grid-column:2}
  .navlinks{order:3;width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="bfa-sticker" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#f7f8f4"/><feComposite in2="d" operator="in" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter><symbol id="bfa-cat" viewBox="-8 -8 216 216"><g filter="url(#bfa-sticker)">
  <g stroke="#111410" stroke-linecap="round" stroke-linejoin="round">

function pace(){ // sample: spend per day over the last 7 days, all keys
  const days=[0.22,0.41,0.18,0.35,0.29,0.47,0.26], avg=days.reduce((x,y)=>x+y,0)/days.length;
  const avail=state.balance-state.held, lasts=avail/avg, horizon=state.paceDays;
  const need=Math.max(0, avg*horizon-avail), suggest=need>0 ? Math.max(5, Math.ceil(need)) : 0;
  return { days, avg, avail, lasts, horizon, need, suggest }; }

function syncAuto(validate){ const a=state.auto; if (!$("#abelow")) return true;
  a.below=$("#abelow").value; a.add=$("#aadd").value; a.monthly=$("#amonthly").value;
  if (!validate) return true; const err=$("#aerr"), b=parseFloat(a.below), d=parseFloat(a.add), m=parseFloat(a.monthly);

          <select data-ltype="${i}" aria-label="Limit type"><option value="usd" ${t==="usd"?"selected":""}>USD per day</option><option value="calls" ${t==="calls"?"selected":""}>Calls per day</option></select>
          <input class="input" data-lval="${i}" inputmode="decimal" value="${esc(v)}" aria-label="Limit">
          <button class="iconbtn" data-ldel="${i}" aria-label="Remove limit">×</button></div>`).join("")}
          <div><button class="btn small ghost" id="addlimit">Add a limit for one API</button></div>
        </div>
        <small>A per-API limit can't raise the daily limit above. Whichever is reached first stops the call.</small>
      </div>
      <div class="field"><span>APIs this key can call</span>
        <div class="seg">${[["all","All reviewed APIs"],["allow","Only these (allowlist)"],["block","All except these (blocklist)"]].map(([v,l])=>`<button data-amode="${v}" aria-pressed="${d.access.mode===v}">${l}</button>`).join("")}</div>
        ${d.access.mode==="all" ? `<small>New APIs become callable as soon as they pass review.</small>` : `<div class="picklist">${APIS.map(a=>`<label><input type="checkbox" data-aid="${a.id}" ${d.access.ids.includes(a.id)?"checked":""}><span><span class="mono">${a.id}</span> <span class="sub">${a.state==="live"?"live":a.state==="review"?"in review":"planned"}</span></span></label>`).join("")}</div>
        <small>${d.access.mode==="allow" ? "The key can call only the APIs you tick. Anything else fails with listing_not_allowed and is never paid." : "The key can call every reviewed API except the ones you tick, including APIs added later."}</small>`}
      </div>
      <div class="field"><span>What this key can do</span>
        <div class="scopes">
          <label><input type="checkbox" data-scope="run" ${d.scopes.includes("run")?"checked":""}><span><code>run</code> · pay for API calls within the limits above</span></label>
          <label><input type="checkbox" data-scope="receipts" ${d.scopes.includes("receipts")?"checked":""}><span><code>receipts</code> · read this key's receipts and spend</span></label>
          <label><input type="checkbox" data-scope="topups" ${d.scopes.includes("topups")?"checked":""}><span><code>topups</code> · create top-up links for you to pay. Off by default: the agent can ask for money but never pays it in.</span></label>
        </div>
      </div>
    </div>
    <div class="pf"><span class="sub" style="margin-right:auto;align-self:center" id="kerr"></span><button class="btn solid" id="createkey">Create key</button></div>
  </div>`; }

/* ---------- router ---------- */
function current(){ const h = location.hash.slice(1); if (VIEWS[h]) return h; return "home"; }
function go(v){ if (CONSOLE.includes(v) && !state.signedIn) v = "signin"; if (location.hash.slice(1) !== v) location.hash = v; else render(); }
function render(){
  let v = current();
  if (CONSOLE.includes(v) && !state.signedIn) v = "signin";
  if (v === "signin" && state.signedIn) v = "overview";
  $("#app").innerHTML = `<div class="view">${VIEWS[v]()}</div>`;
  document.querySelectorAll(".navlinks a[data-go]").forEach(a => a.toggleAttribute("aria-current", a.dataset.go === v) || a.removeAttribute("aria-current"));
  document.querySelectorAll(".navlinks a[data-go]").forEach(a => { if (a.dataset.go === v) a.setAttribute("aria-current","page"); });
  const ab = $("#authbtn"); ab.textContent = state.signedIn ? "Console" : "Sign in"; ab.dataset.go = state.signedIn ? "overview" : "signin";
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

/* ---------- events (delegated) ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, tr"); if (!t) return;
  if (t.id === "signout") { e.preventDefault(); state.signedIn = false; go("home"); toast("Signed out"); return; }
  if (t.dataset.go) { e.preventDefault(); if (t.dataset.new) state.draft = newDraft(); go(t.dataset.go); return; }
  if (t.dataset.copy) { const el = document.getElementById(t.dataset.copy); if (el) copy(el.textContent, t); return; }
  if (t.dataset.api) { state.openApi = state.openApi === t.dataset.api ? null : t.dataset.api; render(); return; }
  if (t.dataset.client) { state.client = t.dataset.client; render(); return; }
  if (t.dataset.filter) { state.apiFilter = t.dataset.filter; render(); return; }
  if (t.id === "google" || t.id === "emailbtn") {
    if (t.id === "emailbtn") { const em = $("#email").value.trim(); if (!/^\S+@\S+\.\S+$/.test(em)) { toast("Enter an email address like you@example.com"); return; } state.email = em; }
    state.signedIn = true; go("overview"); toast("Signed in (preview)"); return; }
  if (t.id === "newkey") { state.draft = newDraft(); state.newSecret = null; render(); return; }
  if (t.id === "cancelkey") { state.draft = null; render(); return; }
  if (t.dataset.exp) { syncDraft(); state.draft.exp = t.dataset.exp; render(); return; }
  if (t.dataset.amode) { syncDraft(); state.draft.access.mode = t.dataset.amode; render(); return; }
  if (t.id === "addlimit") { syncDraft(); state.draft.perApi.push(["bfa/near-account","calls","100"]); render(); return; }
  if (t.dataset.ldel) { syncDraft(); state.draft.perApi.splice(+t.dataset.ldel,1); render(); return; }
  if (t.id === "createkey") { createKey(); return; }
  if (t.id === "dismiss") { state.newSecret = null; render(); return; }
  if (t.dataset.revoke) { const k = state.keys[+t.dataset.revoke]; k.status = "revoked"; render(); toast(`Revoked ${k.name}. Calls with it now fail with key_revoked.`); return; }
  if (t.dataset.amt) { state.topup.amount = +t.dataset.amt; render(); return; }
  if (t.dataset.method) { state.topup.method = t.dataset.method; render(); return; }
  if (t.dataset.pdays) { state.paceDays = +t.dataset.pdays; render(); return; }
  if (t.dataset.suggest) { state.topup.amount = +t.dataset.suggest; render(); document.getElementById("pay")?.scrollIntoView({block:"center"}); toast(`Top-up set to ${usd2(+t.dataset.suggest)}`); return; }
  if (t.id === "autotoggle") { syncAuto(); state.auto.on = !state.auto.on; render(); toast(state.auto.on ? "Auto top-up is on" : "Auto top-up is off"); return; }
  if (t.dataset.asrc) { syncAuto(); state.auto.source = t.dataset.asrc; render(); return; }
  if (t.id === "autosave") { if (syncAuto(true)) { render(); toast("Auto top-up saved (preview)"); } return; }
  if (t.id === "pay") { toast(state.topup.method==="card" ? "Preview: the Privy on-ramp opens here once it's connected" : state.topup.method==="base" ? "Preview: BFA credits your balance when the deposit confirms" : "Preview: a NEAR Intents quote appears here"); return; }
});
document.addEventListener("keydown", e => { const r = e.target.closest?.("tr[data-api]"); if (r && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); r.click(); } });
document.addEventListener("input", e => {
  if (e.target.id === "apiq") { state.apiQuery = e.target.value; const pos = e.target.selectionStart; render(); const q=$("#apiq"); q.focus(); q.setSelectionRange(pos,pos); }
  if (e.target.id === "amt") { const v = parseFloat(e.target.value); if (!isNaN(v)) { state.topup.amount = Math.round(v*100)/100; const pos=e.target.selectionStart; render(); const a=$("#amt"); a.focus(); a.setSelectionRange(pos,pos); } }
});

function newDraft(){ return { name:"", exp:"30", date:addDays(30), daily:"1.00", perApi:[["nansen/smart-money-holdings","usd","0.50"]], scopes:["run","receipts"], access:{mode:"all",ids:[]} }; }
function syncDraft(){ const d = state.draft; if (!d || !$("#keyform")) return;
  d.name = $("#kname").value; d.daily = $("#kdaily").value; if ($("#kdate")) d.date = $("#kdate").value;
  d.perApi = d.perApi.map((_,i)=>[document.querySelector(`[data-lapi="${i}"]`).value, document.querySelector(`[data-ltype="${i}"]`).value, document.querySelector(`[data-lval="${i}"]`).value]);
  d.scopes = [...document.querySelectorAll("[data-scope]")].filter(c=>c.checked).map(c=>c.dataset.scope);
  if (document.querySelector("[data-aid]")) d.access.ids = [...document.querySelectorAll("[data-aid]")].filter(c=>c.checked).map(c=>c.dataset.aid); }
function createKey(){ syncDraft(); const d = state.draft, err = $("#kerr");
  const daily = parseFloat(d.daily);
  if (!d.name.trim()) { err.textContent = "Give the key a name."; $("#kname").focus(); return; }
  if (!(daily > 0)) { err.textContent = "Set a daily limit above $0."; $("#kdaily").focus(); return; }
  if (d.exp === "custom" && !d.date) { err.textContent = "Pick an expiry date."; return; }
  const bad = d.perApi.find(([,,v]) => !(parseFloat(v) > 0)); if (bad) { err.textContent = `Set a limit above 0 for ${bad[0]}, or remove that row.`; return; }
  const over = d.perApi.find(([,t,v]) => t==="usd" && parseFloat(v) > daily); if (over) { err.textContent = `${over[0]} is limited to more than the daily limit for all APIs.`; return; }
  if (d.access.mode !== "all" && !d.access.ids.length) { err.textContent = d.access.mode==="allow" ? "Tick at least one API for the allowlist, or choose All reviewed APIs." : "Tick at least one API to block, or choose All reviewed APIs."; return; }
  if (!d.scopes.includes("run")) { err.textContent = "Without run, the agent can't pay for any call."; }
  const secret = randKey();
  state.keys.unshift({ name:d.name.trim(), prefix:secret.slice(0,16), created:addDays(0), expires:d.exp==="custom"?d.date:addDays(+d.exp),
    daily:daily.toFixed(2), spent:"0", perApi:d.perApi.map(([id,t,v])=>[id,t,t==="usd"?(+v).toFixed(2):String(parseInt(v))]), scopes:d.scopes, access:{mode:d.access.mode, ids:[...d.access.ids]}, status:"active" });
  state.newSecret = secret; state.draft = null; render(); window.scrollTo(0,0);
}
render();
</script>
